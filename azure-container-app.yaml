# Azure Container Apps (ACA) Production Specification for QueryFusion
# Architecture: 2.0 vCPU / 4.0 GiB RAM on Serverless Consumption Plan
# Optimization: 60s cooldown drain, concurrency=5, scale-to-zero (minReplicas=0)
$schema: https://azure.github.io/aca-dotnet/spec.json
location: eastus
name: queryfusion-api
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: <MANAGED_ENVIRONMENT_ID>
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 8080
      transport: auto
      allowInsecure: false
      corsPolicy:
        allowedOrigins:
          - "*"
      traffic:
        - latestRevision: true
          weight: 100
  template:
    containers:
      - name: queryfusion
        image: ghcr.io/vivek-kanugula/queryfusion:latest
        resources:
          cpu: 2.0
          memory: 4.0Gi
        env:
          - name: APP_ENV
            value: "production"
          - name: CONTAINER_CPU_LIMIT
            value: "2.0"
          - name: LOG_LEVEL
            value: "INFO"
          - name: MALLOC_MMAP_THRESHOLD_
            value: "131072"
          - name: MALLOC_TRIM_THRESHOLD_
            value: "131072"
          - name: DATABASE_URL
            secretRef: database-url
          - name: MAX_STORAGE_MB
            value: "3500"
          - name: MAX_UPLOAD_SIZE_MB
            value: "100"
          - name: MAX_DOCUMENTS_COUNT
            value: "250"
          - name: DB_POOL_SIZE
            value: "5"
          - name: DB_MAX_OVERFLOW
            value: "2"
          - name: DB_POOL_TIMEOUT
            value: "10"
          - name: BM25_USE_BLOB
            value: "true"
          - name: BM25_BLOB_PREFIX
            value: "bm25-indices"
        probes:
          - type: Startup
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 10
          - type: Liveness
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
    scale:
      minReplicas: 0
      maxReplicas: 1
      rules:
        - name: http-scaling-rule
          http:
            metadata:
              concurrentRequests: "5"
            cooldownPeriod: 60
