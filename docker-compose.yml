services:
  db:
    image: pgvector/pgvector:pg16
    container_name: queryfusion-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hybrid_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hybrid_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: queryfusion-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/hybrid_rag
      DATABASE_URL_DIRECT: postgresql+psycopg://postgres:postgres@db:5432/hybrid_rag
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      APP_ENV: production
    ports:
      - "8000:8000"

volumes:
  pgdata:
