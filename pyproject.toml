[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Hybrid RAG Intelligence & Benchmarking Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",

    "fastembed>=0.4,<1.0",
    "bm25s[core]>=0.2,<1.0",
    "PyStemmer>=2.2,<3.0",
    "google-genai>=1.0,<3.0",
    "pymupdf>=1.24,<2.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.0,<6.0",
    "markdown-it-py>=3.0,<4.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.9",
    "pgvector>=0.3.0",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.2,<1.0",
    "scipy>=1.14,<2.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: integration tests that load ML models"]
